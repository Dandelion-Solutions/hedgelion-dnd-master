name: DCR migration candidate

on:
  push:
    branches:
      - v1/engine-rearchitecture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build proven inputs and apply candidate migration
        run: |
          mkdir -p dcr-migration-candidate
          python DEV/TOOLS/audit_documentation_corpus_references.py \
            --write-targets-manifest dcr-migration-candidate/pre-migration-targets.json \
            --output dcr-migration-candidate/pre-migration-reference-report.json
          python DEV/TOOLS/build_documentation_corpus_migration_map.py \
            --targets-manifest dcr-migration-candidate/pre-migration-targets.json \
            --output dcr-migration-candidate/migration-map.json
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath

          sys.path.insert(0, str(Path('DEV/TOOLS').resolve()))
          from apply_documentation_corpus_migration import apply_migration
          from plan_documentation_corpus_path_repairs import build_path_repair_plan

          root = Path('.').resolve()
          migration = json.loads(Path('dcr-migration-candidate/migration-map.json').read_text(encoding='utf-8'))
          expected = {
              'target_count': 419,
              'resolved_target_count': 419,
              'unresolved_target_count': 0,
              'move_count': 370,
              'retain_count': 49,
              'specs_to_design': 333,
              'specs_to_research': 1,
              'retained_specs': 41,
              'research_to_design': 36,
              'retained_research': 8,
              'extraction_count': 1,
          }
          if migration['counts'] != expected or migration['unresolved_targets']:
              raise SystemExit('migration-map accounting changed before candidate application')

          tracked = subprocess.run(['git', 'ls-files', '-z'], check=True, stdout=subprocess.PIPE).stdout.decode('utf-8').split('\0')
          repository_files = [root / path for path in tracked if path]
          plan = build_path_repair_plan(root, migration, repository_files=repository_files)
          Path('dcr-migration-candidate/pre-migration-path-repair-plan.json').write_text(
              json.dumps(plan, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          mmap = {row['old_path']: row for row in migration['rows']}
          repairs = [
              {
                  'source_path': row['source_path'],
                  'line': row['line'],
                  'old_literal': row['old_literal'],
                  'new_literal': row['new_literal'],
              }
              for row in plan['mechanical_repairs']
          ]
          exceptions = []

          for row in plan['basename_only_review']:
              source = row['source_path']
              target = row['target_path']
              source_final = mmap[source]['destination_path'] if source in mmap else source
              target_final = mmap[target]['destination_path']
              if PurePosixPath(source_final).parent == PurePosixPath(target_final).parent:
                  continue

              basename = PurePosixPath(target).name
              if (
                  source == 'DEV/docs/superpowers/design/2026-08-29-documentation-corpus-refactor-specs-census-part-13.md'
                  and target == 'DEV/docs/superpowers/specs/2026-08-20-step-6-repository-port-transport-feasibility-spike.md'
              ):
                  exceptions.append(row)
                  continue

              if (
                  source.startswith('DEV/docs/superpowers/specs/')
                  and mmap[source]['action'] == 'RETAIN'
                  and PurePosixPath(target_final).parent.as_posix() == 'DEV/docs/superpowers/design'
              ):
                  repairs.append({
                      'source_path': source,
                      'line': row['line'],
                      'old_literal': basename,
                      'new_literal': '../design/' + basename,
                  })
                  continue

              if source == 'DEV/ARCHITECTURE/CANONICAL_ARCHITECTURE_INDEX.md':
                  repairs.append({
                      'source_path': source,
                      'line': row['line'],
                      'old_literal': basename,
                      'new_literal': target_final,
                  })
                  continue

              if source == 'DEV/TESTS/test_release_game_passthrough.py':
                  repairs.append({
                      'source_path': source,
                      'line': row['line'],
                      'old_literal': "'specs' / '" + basename + "'",
                      'new_literal': "'design' / '" + basename + "'",
                  })
                  continue

              raise SystemExit('unresolved cross-directory basename occurrence: ' + json.dumps(row, sort_keys=True))

          if len(plan['mechanical_repairs']) != 365:
              raise SystemExit(f"mechanical repair count drifted: {len(plan['mechanical_repairs'])}")
          if len(repairs) != 503:
              raise SystemExit(f"reviewed total repair count drifted: {len(repairs)}")
          if len(exceptions) != 2:
              raise SystemExit(f"historical exception count drifted: {len(exceptions)}")

          Path('dcr-migration-candidate/repairs.json').write_text(
              json.dumps(repairs, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('dcr-migration-candidate/historical-exceptions.json').write_text(
              json.dumps(exceptions, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          result = apply_migration(root, migration=migration, repairs=repairs)
          if result != {'move_count': 370, 'repair_count': 503, 'extraction_count': 1}:
              raise SystemExit('candidate application accounting mismatch: ' + json.dumps(result, sort_keys=True))

          # Temporary DCR-only workflows are not part of the durable post-refactor tree.
          Path('.github/workflows/dcr-reference-audit.yml').unlink()
          Path('.github/workflows/dcr-migration-candidate.yml').unlink()

          # Verify exact physical disposition before running repository tests.
          for item in migration['rows']:
              old = root / item['old_path']
              destination = root / item['destination_path']
              if item['action'] == 'MOVE':
                  if old.exists() or not destination.is_file():
                      raise SystemExit('physical move verification failed: ' + item['old_path'])
              elif item['action'] == 'RETAIN':
                  if not old.is_file() or destination != old:
                      raise SystemExit('retained-source verification failed: ' + item['old_path'])

          if not (root / 'DEV/docs/superpowers/research/2026-08-24-chatgpt-plus-host-evidence.md').is_file():
              raise SystemExit('R-015 extraction missing')

          # Verify every approved repair at its post-migration source location.
          for repair in repairs:
              source = repair['source_path']
              source_final = mmap[source]['destination_path'] if source in mmap else source
              lines = (root / source_final).read_text(encoding='utf-8').splitlines()
              line = lines[int(repair['line']) - 1]
              if repair['new_literal'] not in line:
                  raise SystemExit('post-move repair verification failed: ' + json.dumps(repair, sort_keys=True))

          for exception in exceptions:
              lines = (root / exception['source_path']).read_text(encoding='utf-8').splitlines()
              if PurePosixPath(exception['target_path']).name not in lines[int(exception['line']) - 1]:
                  raise SystemExit('historical exception was not preserved')
          PY

          python DEV/TOOLS/audit_documentation_corpus_references.py \
            --targets-manifest dcr-migration-candidate/pre-migration-targets.json \
            --output dcr-migration-candidate/post-migration-frozen-reference-report.json

          rm -rf .hdm-devtools
          DEV/TOOLS/run_maintenance_audit
          .hdm-devtools/venv/bin/python -m unittest discover -s DEV/TESTS -v

      - name: Freeze verified candidate tree metadata
        run: |
          git diff --check
          git add -A
          mkdir -p dcr-migration-candidate/candidate-files
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          root = Path('.').resolve()
          raw = subprocess.run(['git', 'diff', '--cached', '--name-status', '-z'], check=True, stdout=subprocess.PIPE).stdout
          fields = raw.decode('utf-8').split('\0')
          ops = []
          i = 0
          while i < len(fields) and fields[i]:
              status = fields[i]
              i += 1
              if status.startswith('R'):
                  old = fields[i]; new = fields[i + 1]; i += 2
                  ops.append({'status': status, 'old_path': old, 'path': new})
              else:
                  path = fields[i]; i += 1
                  ops.append({'status': status, 'path': path})

          # Record pre-existing remote blob ids for unchanged-blob reuse.
          def index_sha(path):
              result = subprocess.run(['git', 'rev-parse', 'HEAD:' + path], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True)
              return result.stdout.strip() if result.returncode == 0 else None

          tree_ops = []
          changed_payload_files = []
          for op in ops:
              status = op['status'][0]
              if status == 'D':
                  tree_ops.append({'path': op['path'], 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              if status == 'R':
                  old = op['old_path']; new = op['path']
                  old_sha = index_sha(old)
                  new_bytes = (root / new).read_bytes()
                  old_bytes = subprocess.run(['git', 'show', 'HEAD:' + old], check=True, stdout=subprocess.PIPE).stdout
                  tree_ops.append({'path': old, 'mode': '100644', 'type': 'blob', 'sha': None})
                  if new_bytes == old_bytes:
                      tree_ops.append({'path': new, 'mode': '100644', 'type': 'blob', 'sha': old_sha, 'requires_content': False})
                  else:
                      tree_ops.append({'path': new, 'mode': '100644', 'type': 'blob', 'sha': None, 'requires_content': True})
                      changed_payload_files.append(new)
                  continue

              path = op['path']
              before_sha = index_sha(path)
              if status == 'M' or status == 'A':
                  tree_ops.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None, 'requires_content': True})
                  changed_payload_files.append(path)
              else:
                  raise SystemExit('unsupported candidate status: ' + op['status'])

          for path in changed_payload_files:
              destination = Path('dcr-migration-candidate/candidate-files') / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(root / path, destination)

          summary = {
              'head_sha': '${{ github.sha }}',
              'changed_entry_count': len(ops),
              'tree_operation_count': len(tree_ops),
              'changed_payload_file_count': len(changed_payload_files),
              'candidate_tree_sha_local': subprocess.run(['git', 'write-tree'], check=True, stdout=subprocess.PIPE, text=True).stdout.strip(),
          }
          Path('dcr-migration-candidate/candidate-tree-ops.json').write_text(json.dumps(tree_ops, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          Path('dcr-migration-candidate/candidate-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          Path('dcr-migration-candidate/candidate.patch').write_bytes(subprocess.run(['git', 'diff', '--cached', '--binary'], check=True, stdout=subprocess.PIPE).stdout)
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload verified migration candidate
        uses: actions/upload-artifact@v4
        with:
          name: dcr-migration-candidate
          path: dcr-migration-candidate/
          if-no-files-found: error
          retention-days: 7
