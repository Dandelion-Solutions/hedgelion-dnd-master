name: DCR migration candidate

on:
  push:
    branches:
      - v1/engine-rearchitecture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify exact migration candidate
        run: python DEV/TOOLS/verify_documentation_corpus_migration_candidate.py --head-sha "${{ github.sha }}"

      - name: Upload verified migration candidate
        uses: actions/upload-artifact@v4
        with:
          name: dcr-migration-candidate
          path: .hdm-maintenance/dcr-migration-candidate/
          if-no-files-found: error
          retention-days: 7
