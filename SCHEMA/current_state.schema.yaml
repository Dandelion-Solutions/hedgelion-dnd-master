schema_name: current_state
schema_version: 1
required: [schema_version, campaign_id, world_time, scenes, active_threads]
fields:
  schema_version: integer
  campaign_id: string
  world_time:
    frontier: object|null
    display: string|null
  scenes:
    type: array
    item:
      scene_id: string
      status: enum[active, suspended]
      location_id: string|null
      local_time: object|null
      participant_ids: array[string]
      player_character_ids: array[string]
      transient_state_path: string|null
      summary: string
  active_threads: array[string]
  pending_consequences: array[object]
  session_runtime:
    last_persisted_event_id: string|null
    last_checkpoint_id: string|null
invariants:
  - keep this record compact; biographies/history belong elsewhere
  - multiplayer may have multiple active scenes
  - scene summary contains actionable current state, not literary recap
  - pending consequences must reference a canonical cause when persistent
