schema_name: campaign_manifest
schema_version: 2
required:
  - schema_version
  - campaign_id
  - branch
  - status
  - mode
  - engine
  - storage
fields:
  schema_version: integer
  campaign_id: string
  campaign_name: string|null
  branch: string
  status: enum[initializing, active, paused, archived]
  mode: enum[singleplayer, multiplayer]
  engine:
    base_tag: string
    base_sha: string
    integrated_tag: string|null
    integrated_main_sha: string
    update_policy: enum[ask, auto]
  rules:
    baseline: string
    house_rules_path: string|null
  storage:
    state_root: string
    index_root: string
    world_root: string
    event_log_root: string
    checkpoints_root: string
  sync:
    force_push_allowed: boolean
    persistence_policy: enum[batched]
  world_time:
    calendar_id: string|null
    frontier: object|null
  players:
    join_policy: enum[invite_only, open_contributors]
    player_ids: array[string]
  last_checkpoint_id: string|null
  last_event_id: string|null
  created_at: string
invariants:
  - branch MUST match campaign/YYYYMMDD or campaign/YYYYMMDD-NN where NN >= 02
  - branch name MUST NOT encode lore, mode, player count or owner
  - force_push_allowed MUST be false for live campaigns
  - campaign owner is derived from Git history and MUST NOT be duplicated in MANIFEST
  - mode changes are owner-only
  - players.join_policy changes are owner-only and default to invite_only when absent in an older manifest
  - open_contributors permits only verified current repository collaborators with sufficient write access to self-create their own player binding
  - engine update_policy changes and engine-release integration are owner-only
  - in singleplayer all gameplay writes are creator-only
  - base_tag/base_sha identify the exact local engine source provenance used when campaign was created
  - integrated_tag/integrated_main_sha identify the exact engine release currently required by the campaign
  - normal production tags MUST resolve to published canonical-engine commits
  - explicit engine-owner development testing MAY use a clearly prefixed dev tag plus exact development commit SHA
  - engine files themselves MUST NOT be copied into the campaign repository
  - update_policy defaults to ask when absent in an older manifest
