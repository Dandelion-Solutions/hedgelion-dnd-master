schema_name: campaign_manifest
schema_version: 2
required:
  - schema_version
  - campaign_id
  - branch
  - status
  - mode
  - engine
  - storage
fields:
  schema_version: integer
  campaign_id: string
  campaign_name: string|null
  campaign_name_origin: enum[auto, player]|null
  branch: string
  status: enum[initializing, active, paused, completed, archived]
  mode: enum[singleplayer, multiplayer]
  engine:
    base_tag: string
    base_sha: string|null
    integrated_tag: string|null
    integrated_main_sha: string|null
    update_policy: enum[ask, auto]
  rules:
    baseline: string
    house_rules_path: string|null
  storage:
    state_root: string
    index_root: string
    world_root: string
    event_log_root: string
    checkpoints_root: string
  sync:
    force_push_allowed: boolean
    persistence_policy: enum[batched]
  world_time:
    calendar_id: string|null
    frontier: object|null
  players:
    join_policy: enum[invite_only, open_contributors]
    player_ids: array[string]
  last_checkpoint_id: string|null
  last_event_id: string|null
  created_at: string
invariants:
  - branch MUST match campaign/YYYYMMDD or campaign/YYYYMMDD-NN where NN >= 02
  - branch name MUST NOT encode lore, mode, player count or owner
  - force_push_allowed MUST be false for live campaigns
  - campaign owner is derived from Git history and MUST NOT be duplicated in MANIFEST
  - mode/join-policy/engine-policy changes follow creator/owner authorization
  - current-layout MANIFEST is at branch root and normally uses STATE, INDEX, WORLD, LOG, CHECKPOINTS roots without CAMPAIGN prefix
  - legacy manifests under CAMPAIGN/ may retain CAMPAIGN-prefixed storage roots and remain valid
  - base_tag/base_sha identify creation engine provenance
  - integrated_tag/integrated_main_sha identify the engine currently required by the campaign
  - published release tags SHOULD store their exact resolved public tag commit SHA
  - explicit engine-owner development testing MAY use dev-v<version> with nullable SHA fields; current public main MUST NOT be queried merely to manufacture those SHA values
  - engine files MUST NOT be copied into campaign repository
  - update_policy defaults to ask when absent in an older manifest
  - campaign_name may remain null until a useful broad campaign identity emerges
  - campaign_name_origin is optional; absent/non-null legacy names are conservatively treated as sticky by CAMPAIGN_IDENTITY.md
  - CAMPAIGN_CARD.campaign_name is a projection of this field and MUST NOT diverge from it
  - completed means the campaign has explicitly ended; a PC death alone MUST NOT automatically imply campaign completion
