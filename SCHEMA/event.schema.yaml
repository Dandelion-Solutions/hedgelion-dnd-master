schema_name: semantic_event
schema_version: 1
required: [schema_version, id, kind, world_order, participants, delta]
fields:
  schema_version: integer
  id: string
  kind: enum[action, consequence, discovery, transfer, relationship, process, combat, travel, social, maintenance, custom]
  world_order:
    time: object|null
    sequence: integer|null
    scene_id: string|null
  location_id: string|null
  participants: array[string]
  caused_by_event_ids: array[string]
  after_event_ids: array[string]
  player_intent:
    player_id: string|null
    pc_id: string|null
    summary: string|null
  resolution:
    rule: string|null
    check: object|null
    random: object|null
    outcome: string|null
  delta:
    created_ids: array[string]
    changed_ids: array[string]
    removed_or_destroyed_ids: array[string]
    factual_changes: array[object]
    knowledge_changes: array[object]
  visibility:
    public_to_player_ids: array[string]
    private_to_player_ids: array[string]
  notes: string|null
invariants:
  - append-only: existing event meaning is never silently rewritten
  - record durable causal transition, not full narration/transcript
  - hidden objective facts may exist in delta without being player-visible
  - random/check data is stored when it materially caused durable state
  - caused_by_event_ids represents actual causal ancestry; after_event_ids represents required relative order without asserting causation
  - world_order.sequence is optional/local and MUST NOT be treated as a mandatory campaign-global event counter
  - world_order.time is optional and should be populated only when temporal precision materially matters
  - independent events may remain unordered when no causal/gameplay dependency requires a relation
  - when a durable transition is directly initiated by a player's decision, player_intent.player_id records the stable campaign PLAYER id and player_intent.pc_id records the acting PC when applicable
  - never use GitHub login as player_intent.player_id; Git identity is authorization/audit evidence, not the canonical gameplay actor
  - a downstream consequence may omit player_intent when caused_by_event_ids preserves the causal chain to the initiating event
  - do not attribute NPC, world-process, maintenance, or incidental derived changes to a player merely because that player's Git commit persisted the same batch
