schema_name: world_scene_state
schema_version: 3
strict: true
required: [name]
fields:
  name: nonempty_string
  location_id: native_identifier
  participant_ids: unique_array[native_identifier]
  focal_entity_ids: unique_array[native_identifier]
  status: object
  details: object
invariants:
  - this is the native world.scene state; record identity and exact file route are derived from the outer world-record id
  - scene is an environment-level state owner and bounded routing context, not a universal catch-all relevance database
  - location_id references a native world.location; participant_ids and focal_entity_ids do not grant PLAYER membership or controlled-PC authority
  - details remain descriptive owner data, not an implicit source of mechanics, references, routing, constraints, or automatic indexes
  - if a compact current actionable summary is retained, it remains descriptive Scene detail and is not a session transcript or LOG history
  - scene-local chronology remains typed and sparse; no mandatory singleton chronology_frontier_event_id or campaign-global frontier is required
  - world_time/local-time observations cannot independently establish DUE, currentness, or cross-scene ordering
  - current LIVE selection and immutable claims come from the exact current campaign STATE/RUNTIME/LIVE_ROUTING.yaml owner; Scene identity or physical co-location does not select a source or authorize mutation
  - LIVE currentness is validated against the selected exact source revision; a Scene pointer or cached blob alone cannot prove it
