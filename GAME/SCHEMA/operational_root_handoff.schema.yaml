schema_name: operational_root_handoff
schema_version: 2
kind: runtime.operational_root_handoff
ephemeral: true
required:
  - schema_version
  - kind
  - campaign_id
  - source_scope
  - source_revision
  - source_key
  - source_lifecycle
  - complete
  - roots
  - ephemeral
fields:
  source_scope: enum[CAMPAIGN, LIVE]
  source_revision: exact-source-revision
  source_key: null | array[string, string, string]
  source_lifecycle: enum[ACTIVE, CLOSED, CLOSED_UNABSORBED, ABSORBED]
  complete: true
  roots:
    type: array
    item:
      owner_kind: enum[runtime.command, runtime.procedure, runtime.interaction, runtime.intent_plan]
      owner_id: string
      route:
        family_key: enum[runtime.command, runtime.procedure, runtime.interaction, runtime.intent_plan]
        identity: array[string]
        relative_path: string
invariants:
  - this carrier is ephemeral handoff evidence, not a persistent operational-root page
  - source lifecycle is not authority; accepted owner-issued absorption evidence is required for campaign recovery
  - CAMPAIGN source_scope requires source_key null; LIVE source_scope requires exactly three non-empty source-key strings whose first component equals campaign_id; runtime validation enforces this cross-field invariant
  - source_revision matches 40/64 lowercase hexadecimal characters or the admitted machine-ID grammar
  - every root route is derived from exact native owner kind and identity
