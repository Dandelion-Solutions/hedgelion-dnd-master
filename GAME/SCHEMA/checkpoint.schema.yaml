schema_name: checkpoint
schema_version: 4
required: [schema_version, id, campaign_id]
fields:
  schema_version: integer
  id: string
  campaign_id: string
  created_at: string
  state: object|null
  engine: object|null
  ruleset: object|null
  schema_data_version: integer|null
invariants:
  - checkpoint is optional compact descriptor/provenance evidence, not current gameplay authority
  - checkpoint engine and ruleset are optional nonauthoritative projections; they never select a replacement runtime or ruleset
  - checkpoint does not define a recovery-completeness frontier, root set, SAVE proof, session lease, or rollback slot
  - omitted checkpoint metadata is not evidence that a current source or historical dependency is absent
  - latest pointer references a canonical checkpoint ID/path only; null is a healthy value
