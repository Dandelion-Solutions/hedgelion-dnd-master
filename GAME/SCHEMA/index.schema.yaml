schema_name: native_family_index
schema_version: 2
required: [schema_version, family_key, entries]
fields:
  schema_version: integer
  family_key: string
  entries:
    type: array
    item:
      id: string
      name: string|null
      aliases: array[string]
      status: string|null
      path: string
      parent_id: string|null
      tags: array[string]
      last_event_id: string|null
invariants:
  - index is a derived discovery helper, not a semantic authority or presence owner
  - known-ID reads derive their exact native route and do not load this index
  - candidates are revalidated by exact native owner reads before material use
  - index absence does not prove semantic absence
  - entries remain compact and contain no owner body, private continuity, knowledge, disclosure, Story, LIVE claim or authorization grant
  - aliases are lookup aids and do not redefine canonical identity
