schema_name: player_binding
schema_version: 1
required: [schema_version, player_id, status, controlled_pc_ids]
fields:
  schema_version: integer
  player_id: string
  status: enum[active, inactive]
  deactivated_by: enum[self, creator]|null
  display_name: string|null
  github_binding:
    user_id: integer|null
    login: string|null
  controlled_pc_ids: array[string]
  visibility:
    private_record_ids: array[string]
  preferences:
    campaign_only:
      mechanics_detail: integer|null
      decision_support_detail: integer|null
      adaptive_mechanics_detail: boolean|null
  policy_authority:
    mechanical_override_policy: boolean|null
  joined_event_id: string|null
  last_event_id: string|null
invariants:
  - store only campaign-relevant identity/binding; do not mirror personal ChatGPT Memory/profile
  - player_id is the canonical campaign identity used by sessions/events; never use GitHub login as the gameplay actor ID
  - github_binding.user_id is the stable external authorization binding; github_binding.login is a mutable convenience label and may be refreshed after a GitHub rename
  - multiplayer gameplay authority requires the currently authenticated GitHub user_id to resolve to exactly one active player_id; never trust a self-declared player_id
  - status inactive removes normal gameplay authority but does not delete the PLAYER record, controlled_pc_ids, preferences, policy grants, knowledge links or provenance
  - active bindings should have deactivated_by null
  - inactive with deactivated_by self may be self-reactivated by the same authenticated GitHub user; inactive with deactivated_by creator requires creator reactivation
  - legacy inactive bindings with missing/null deactivated_by are treated conservatively as requiring creator reactivation
  - reactivation reuses the same player_id and existing controlled_pc_ids; it MUST NOT automatically create a replacement PLAYER or PC
  - campaign creator self-removal is not represented by deactivating their own PLAYER binding; use creator-controlled campaign/mode management
  - missing/null mechanical_override_policy means false for a non-creator PLAYER
  - every active PLAYER may adopt INTERPRETIVE_POLICY by default; no stored interpretive-policy grant is required
  - campaign creator has MECHANICAL_OVERRIDE_POLICY authority by creator identity; a non-creator requires an active PLAYER binding plus mechanical_override_policy true
  - only the campaign creator may grant or revoke another PLAYER mechanical_override_policy; a PLAYER may not self-grant this authority
  - mechanical_override_policy grants policy-adoption authority only; it never bypasses deterministic realization, information eligibility, RNG, native owner validation, currentness or publication/CAS
  - mechanics_detail and decision_support_detail are presentation values in range 0..10; null defaults are 3 and 6 respectively
  - mechanics presentation preferences never alter mechanics, randomness, DCs, NPC state, world truth or knowledge boundaries
  - a one-off request for an exact mechanical value does not by itself change stored presentation preference; explicit preference or a clear repeated pattern may update it when adaptive_mechanics_detail is enabled
  - if a player explicitly requests no technical mechanics, both detail values should be 0 unless they specify otherwise
  - a PC controller change requires explicit persistent event
  - player binding is not a source for real-world sensitive personal data
