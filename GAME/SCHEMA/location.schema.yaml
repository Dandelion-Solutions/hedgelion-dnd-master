schema_name: world_location_state
schema_version: 2
strict: true
required: [name]
fields:
  name: nonempty_string
  parent_location_id: native_identifier
  organization_id: native_identifier
  environment_ids: unique_array[native_identifier]
  status: object
  details: object
invariants:
  - this is the native world.location state; its exact file route derives from the outer world-record id
  - parent/location topology and environment references remain with world.location; arbitrary path text is not a route
  - current Actor and Asset placement belongs to those native owners; Location does not keep a reverse present-entity registry
  - scene/thread participation is not inferred from location co-presence
  - objective truth, fictional knowledge and player disclosure remain with their native owners; Location has no known-fact or Secret collection
  - details are descriptive and do not create mechanics, references, currentness, authorization, or index authority
  - LOCATION_INDEX is a discovery projection; known-ID reads derive and validate the exact native route
