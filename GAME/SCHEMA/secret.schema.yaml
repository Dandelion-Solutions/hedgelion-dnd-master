schema_name: secret
schema_version: 1
required: [schema_version, id, status, truth]
fields:
  schema_version: integer
  id: string
  status: enum[active, resolved, obsolete]
  truth: string
  related_entity_ids: array[string]
  established_by_event_id: string|null
  known_by_entity_ids: array[string]
  suspected_by_entity_ids: array[string]
  revelation_conditions: array[object]
  active_thread_ids: array[string]
  last_event_id: string|null
invariants:
  - truth is objective GM state and is never exposed merely because loaded
  - known_by/suspected_by are explicit knowledge boundaries
  - player curiosity does not itself satisfy a revelation condition
