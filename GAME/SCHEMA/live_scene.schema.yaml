schema_name: live_scene_state
schema_version: 2
required:
  - schema_version
  - kind
  - source_key
  - source_revision
  - next_source_native_creation_ordinal
  - source_native_ids
  - native_owner_states
  - provenance
  - privacy
  - chronology
  - unresolved_work
fields:
  schema_version: integer[2]
  kind: const(runtime.live_native_state_pack)
  source_key: tuple[campaign_id, scene_id, epoch_id]
  source_revision: exact_source_revision
  next_source_native_creation_ordinal: integer[>=1]
  source_native_ids: unique_array[native_identifier]
  native_owner_states: object[native_family, native_owner_state]
  provenance: object[owner_provenance]
  privacy: object[owner_privacy_state]
  chronology: object[typed_chronology_evidence]
  unresolved_work: object[owner_unresolved_work]
invariants:
  - this is the lossless physical carrier for explicitly routed native owner states and cross-cutting evidence; it does not create a scene-wide semantic owner
  - source_key and source_revision bind the pack to the exact selected LIVE source; currentness and lifecycle status remain in the owner-typed campaign route
  - source-native identities and the next creation ordinal are preserved without campaign-allocator fallback or rekeying
  - native owner states remain subject to their own identity, state, privacy, chronology, and durability contracts
  - provenance, privacy, chronology, and unresolved-work sections are typed owner evidence, not alternate semantic owners
  - no transcript, broad scene overlays, copied PLAYER roster, or legacy per-PC knowledge/disclosure authority is stored here
