schema_name: live_scene_state
schema_version: 2
required:
  - schema_version
  - campaign_id
  - epoch_id
  - scene_id
  - status
  - opening_campaign_revision
  - source_ref
  - source_revision
  - base_campaign_sha
  - revision
  - participant_ids
  - player_character_ids
fields:
  schema_version: integer
  campaign_id: string
  epoch_id: string
  scene_id: string
  status: enum[active, closed]
  opening_campaign_revision: string
  source_ref: string
  source_revision: string
  base_campaign_sha: string
  base_scene_blob_sha: string|null
  revision: integer
  local_time: object|null
  participant_ids: array[string]
  player_character_ids: array[string]
  scene_overlay:
    set: array[object]
    unset: array[string]
  entity_overlays:
    type: array[object]
    item_fields:
      entity_id: string
      entity_type: string
      set: array[object]
      unset: array[string]
  created_entities:
    type: array[object]
    item_fields:
      provisional_id: string
      entity_type: string
      data: object
  live_facts:
    type: array[object]
    item_fields:
      fact_id: string
      fact: object
      known_by_pc_ids: array[string]
      established_by_live_event_id: string|null
  observable_events:
    type: array[object]
    item_fields:
      live_event_id: string
      world_time: object|null
      actor_player_id: string|null
      actor_pc_id: string|null
      summary: string
      perceived_by_pc_ids: array[string]
      touched_entity_ids: array[string]
  pending_durable_events: array[object]
  touched_campaign_paths: array[string]
  touched_entity_ids: array[string]
invariants:
  - campaign_id is the canonical semantic campaign identity; it is not derived from a branch or physical route token
  - source_ref is physical routing material and must equal the derived c1/s1/e1 LIVE ref after body validation
  - campaign_branch and live_branch, when retained by a transport adapter, are routing metadata only and never semantic identity
  - epoch_id is the full e1 SHA-256 identity of the immutable opening basis and is not truncated
  - only LIVE/LIVE_STATE.yaml is runtime-mutated on a live branch
  - revision increments once for each successful logical live-state write
  - absent overlay fields inherit from base_campaign_sha
  - overlay set/unset paths are explicit and deterministic; prose is not a merge instruction
  - touched_campaign_paths and touched_entity_ids are cumulative for the whole epoch
  - observable_events are compact semantic perception facts, not a transcript
  - objective truth and per-PC knowledge/disclosure remain distinct
  - epoch-scoped provisional entity IDs cannot escape the epoch before durable compaction
  - one mutable entity cannot be actively owned by two live epochs
  - status closed accepts no new ordinary gameplay writes
  - status closed freezes the epoch but does not itself prove durable absorption; the campaign scene last_absorbed_live_head_sha/routing state proves handoff completion
