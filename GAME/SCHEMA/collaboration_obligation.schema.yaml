schema_name: collaboration_obligation
schema_version: 1
required:
  - schema_version
  - kind
  - obligation_id
  - generation
  - lifecycle
  - coordination_family
  - campaign_id
  - purpose
  - dependency_scope
  - decision_opportunity_ref
  - currentness_basis
  - required_contributors
  - optional_contributors
  - accepted_input_uses
  - safe_frontier_refs
fields:
  schema_version: integer[1]
  kind: const[runtime.collaboration_obligation]
  obligation_id: native_identifier
  generation: integer[>=1]
  lifecycle: enum[OPEN, CLOSED, RESOLVED, OBSOLETE]
  coordination_family: const[AGENCY_DEPENDENT_COLLECTIVE]
  campaign_id: native_identifier
  purpose: string
  dependency_scope: string
  decision_opportunity_ref: string
  currentness_basis:
    source_ref: string
    source_revision: revision
    opportunity_ref: string
  required_contributors:
    array[participant_ref]
  optional_contributors:
    array[participant_ref]
  accepted_input_uses:
    array[accepted_input_ref]
  safe_frontier_refs: array[native_identifier]
  execution_anchor_clause_ref: accepted_input_ref|null
  closed_input_set_fingerprint: sha256|null
participant_ref:
  player_id: native_identifier
  pc_id: native_identifier|null
accepted_input_ref:
  interaction_id: native_identifier
  clause_id: native_identifier
invariants:
  - only AGENCY_DEPENDENT_COLLECTIVE may create a durable collaboration obligation
  - required participants are exact current PLAYER/controlled-PC references supplied by the access owner
  - caller-provided family, contributor IDs, login and currentness flags are not authority
  - the obligation stores references and never transcript prose, message bodies, full intent plans or private context
  - Procedure, Continuation, Choice and Reaction remain native ordered owners and are not mirrored here
  - value.contribution remains the Rule-Element mechanical calculation vocabulary and is not human collaboration input
  - collaboration owns collection/waiting lifecycle only and never gameplay consequence, authorization, chronology or knowledge
