schema_name: runtime_collaboration_obligation
schema_version: 1
required: [schema_version, kind, obligation_id, generation, lifecycle, coordination_family, campaign_id, interaction_id, intent_plan_id, clause_id, dependency_class, purpose, dependency_scope, native_basis_refs, required_contributors, optional_contributors, accepted_input_uses]
fields:
  schema_version: integer
  kind: const(runtime.collaboration_obligation)
  obligation_id: string
  generation: integer
  lifecycle: enum[OPEN, CLOSED, RESOLVED, OBSOLETE]
  coordination_family: const(AGENCY_DEPENDENT_COLLECTIVE)
  campaign_id: string
  interaction_id: string
  intent_plan_id: string
  clause_id: string
  dependency_class: enum[JOINT_VOLUNTARY_ACTION, SHARED_DECISION_OR_NEGOTIATION, SHARED_SCARCE_RESOURCE_CHOICE, SCENE_CHRONOLOGY_CONVERGENCE, PC_CONSEQUENCE_DECISION]
  purpose: string
  dependency_scope: object
  native_basis_refs: array
  required_contributors: array
  optional_contributors: array
  accepted_input_uses: array
invariants:
  - opportunity identity is exactly (interaction_id, clause_id) from the accepted native owner graph
  - collaboration obligations are created only after exact Interaction, IntentPlan, clause, PLAYER and native-basis revalidation
  - the obligation is collection authority only; it is not PLAYER, Procedure, chronology, mechanics or message authority
  - no generic opportunity record, registry, token or coordination index is part of this family
  - optional contributors cannot block a generation through silence
