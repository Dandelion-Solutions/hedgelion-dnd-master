schema_name: player_character
schema_version: 1
required: [schema_version, id, status, identity, mechanics, inventory, knowledge]
fields:
  schema_version: integer
  id: string
  status: enum[provisional, active, inactive, dead, retired]
  controlled_by_player_id: string|null
  identity:
    name: string|null
    pronouns: string|null
    description: string|null
    player_defined_traits: array[string]
    background_notes: array[string]
  mechanics:
    rules_source: string
    level: integer|null
    classes: array[object]
    background: object|null
    species: object|null
    abilities: object
    proficiencies: object
    defenses: object
    hp: object
    movement: object
    conditions: array[object]
    resources: object
    spells: object|null
    features: array[object]
    derived: object
  location_id: string|null
  inventory:
    currency: object
    item_refs: array[string]
    mundane_items: array[object]
  knowledge:
    known_fact_ids: array[string]
    belief_records: array[object]
    discovered_location_ids: array[string]
  relationships: array[object]
  active_thread_ids: array[string]
  last_event_id: string|null
invariants:
  - voluntary personality/thoughts/emotions remain player-owned
  - identity.description may contain current DM-seeded external/surface facts; this does not make them player-authored
  - player_defined_traits contains only facts explicitly established by the player; silence never converts a DM-seeded default into player-defined authorship
  - compatible explicit player corrections supersede DM-seeded surface defaults; mechanical/equipment/causally-dependent changes follow normal rules
  - provisional records may contain null/empty mechanical placeholders while the build is genuinely unresolved
  - status active requires READY_PC under CORE/CHARACTER_READINESS.md; mechanically required current-level values may not remain null/empty placeholders
  - an active PC must contain sufficient class/level/species-or-origin/ability/proficiency/defense/HP/movement/resource/feature/equipment state to resolve ordinary play without inventing character mechanics later
  - spellcasting active PCs must contain the exact current spellcasting inputs and known/prepared spell state required by their current rules
  - significant items use ITEM IDs; disposable mundane inventory may be embedded
  - exact mechanical values come from adopted rules/house rules, not narrative inference
  - canonical base mechanics plus persistent modifiers must be sufficient to deterministically derive any gameplay modifier needed for adjudication
  - derived values may be cached for convenience but must be recomputable from canonical dependencies and refreshed when those dependencies change
  - player mechanics-presentation preference never changes stored/derived character mechanics or permits an incomplete active sheet
